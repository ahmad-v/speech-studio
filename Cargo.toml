[package]
name = "speech-studio"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
description = "Local speech and transcript workbench"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
localwright-core = { git = "https://github.com/ahmad-v/localwright", rev = "3522b18eb7600eda67055a89e815150b2b0b7acb", version = "=0.1.0-alpha.1" }
localwright-ui = { git = "https://github.com/ahmad-v/localwright", rev = "3522b18eb7600eda67055a89e815150b2b0b7acb", version = "=0.1.0-alpha.1", optional = true }
serde_json = "=1.0.140"
hound = "=3.5.1"
sha2 = "=0.10.8"
whisper-rs = { version = "=0.14.4", optional = true }


[features]
default = ["gui"]
gui = ["dep:localwright-ui"]
asr = ["dep:whisper-rs"]

[dev-dependencies]
tempfile = "=3.19.1"

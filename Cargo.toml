[package]
name = "speech-studio"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
description = "Local speech and transcript workbench"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
localwright-core = { git = "https://github.com/ahmad-v/localwright", rev = "73eb5fbbfe12f69db1524bfd7b680ca16e543c05", version = "=0.1.0" }
localwright-ui = { git = "https://github.com/ahmad-v/localwright", rev = "73eb5fbbfe12f69db1524bfd7b680ca16e543c05", version = "=0.1.0", optional = true }
iced = { version = "=0.13.1", default-features = false, features = ["tiny-skia", "fira-sans", "async-std", "canvas"], optional = true }
rfd = { version = "=0.15.4", default-features = false, features = ["async-std", "xdg-portal"], optional = true }
serde = { version = "=1.0.221", features = ["derive"] }
serde_json = "=1.0.140"
hound = "=3.5.1"
sha2 = "=0.10.9"
unicode-segmentation = "=1.13.3"
whatlang = "=0.18.0"
whisper-rs = { version = "=0.14.4", optional = true }
rodio = { version = "=0.20.1", default-features = false, features = ["symphonia-all", "symphonia-aiff"], optional = true }
symphonia = { version = "=0.5.5", default-features = false, features = ["ogg"], optional = true }
cpal = { version = "=0.15.3", optional = true }


[features]
default = ["gui", "audio-playback"]
gui = ["dep:localwright-ui", "dep:iced", "dep:rfd"]
asr = ["dep:whisper-rs"]
audio-playback = ["dep:rodio", "dep:symphonia", "dep:cpal"]

[dev-dependencies]
tempfile = "=3.19.1"

[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

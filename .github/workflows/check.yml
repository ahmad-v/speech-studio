name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: X64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: ARM64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            arch: X64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: ARM64
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: ARM64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Verify locked build and tests
        run: |
          cargo --version
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo tree --locked
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Verify headless mode
        run: |
          cargo test --locked --no-default-features
          cargo run --locked --no-default-features -- --cli --help
      - name: Check optional ASR build
        if: runner.os == 'Linux' && matrix.arch == 'X64'
        run: |
          sudo apt-get install -y cmake libclang-dev
          cargo check --locked --no-default-features --features asr
      - name: Build and smoke-test a portable preview
        env:
          BUILD_TARGET: ${{ matrix.target }}
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          cargo build --locked --release --target "$BUILD_TARGET"
          executable="${GITHUB_REPOSITORY##*/}"
          python_cmd=python3
          if [[ "$RUNNER_OS" == Windows ]]; then
            executable="$executable.exe"
            python_cmd=python
          fi
          "$python_cmd" packaging/portable.py \
            --target "$BUILD_TARGET" \
            --binary "target/$BUILD_TARGET/release/$executable" \
            --output dist/preview
      - name: Upload portable preview
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: preview-${{ matrix.target }}
          path: dist/preview/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

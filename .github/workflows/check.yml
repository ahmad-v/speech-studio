name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Keep this stable: it is the ordinary branch-protection check context.
    name: Rust (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify documentation-only changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'code_changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          code_changed=false
          for path in "${changed[@]}"; do
            case "$path" in
              *.md|docs/*.md|docs/*/*.md|docs/capabilities.json|.github/workflows/*.yml|.github/workflows/*.yaml) ;;
              *) code_changed=true; break ;;
            esac
          done
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          printf 'Code checks required: %s\n' "$code_changed"

      - name: Check whitespace and capability registry
        run: |
          if [[ "$BASE_SHA" != "" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check
          fi
          python3 -m json.tool docs/capabilities.json >/dev/null
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}

      - name: Validate Cargo manifest
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Install Linux GUI build prerequisites
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libasound2-dev

      - name: Restore Cargo registry and target cache
        if: steps.scope.outputs.code_changed == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}-debug-default-gui-no-asr
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify locked Linux build and tests
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          rustup show active-toolchain
          cargo fmt --all -- --check
          python3 -m unittest discover -s packaging -p 'test_*.py' -v
          cargo check --locked --all-targets
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

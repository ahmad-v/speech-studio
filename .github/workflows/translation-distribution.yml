name: Offline translation model bundle

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: translation-pack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'translation-validation'))
    name: Build and run verified English-to-French offline pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install network-trace verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y strace

      - name: Assemble pinned model assets
        run: python3 packaging/translation_model_pack.py assemble "$RUNNER_TEMP/opus-mt-en-fr.zip"

      - name: Build the translation engine without GUI or audio dependencies
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo build --locked --no-default-features --features translation --bin speech-studio -j 2

      - name: Install the model and verify real offline translation
        run: |
          set -euo pipefail
          python3 packaging/translation_model_pack.py install \
            "$RUNNER_TEMP/opus-mt-en-fr.zip" "$GITHUB_WORKSPACE/target/debug"
          printf 'Good morning.\n' > "$RUNNER_TEMP/source.txt"
          target/debug/speech-studio --cli verify-translation-pack '' '' '' > "$RUNNER_TEMP/verify.json"
          timeout --signal=TERM 240 strace -f -qq -e trace=network -o "$RUNNER_TEMP/network.trace" \
            target/debug/speech-studio --cli translate-text-en-fr \
            "$RUNNER_TEMP/source.txt" "$RUNNER_TEMP/french.txt" '' > "$RUNNER_TEMP/result.json"
          grep -qi 'bonjour' "$RUNNER_TEMP/french.txt"
          ! grep -Eq 'socket\(AF_INET|socket\(AF_INET6|connect\(' "$RUNNER_TEMP/network.trace"
          python3 -m unittest discover -s packaging -p 'test_translation_model_pack.py' -v
          cat "$RUNNER_TEMP/result.json"
          cat "$RUNNER_TEMP/french.txt"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: speech-studio-linux-x64-offline-translation-unsigned
          path: ${{ runner.temp }}/opus-mt-en-fr.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

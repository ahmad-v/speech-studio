name: Offline ASR portable distribution preview

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Offline model to include in the portable bundle
        type: choice
        required: true
        default: whisper-tiny-en
        options:
          - whisper-tiny-en
          - whisper-tiny-multilingual
      target_group:
        description: Native targets to build
        type: choice
        required: true
        default: all
        options:
          - all
          - windows

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: asr-distribution-${{ github.ref }}-${{ inputs.model_id }}
  cancel-in-progress: false

jobs:
  model-pack:
    name: Build pinned offline model pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      model_id: ${{ steps.select.outputs.model_id }}
      model_file: ${{ steps.select.outputs.model_file }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select the pinned model variant
        id: select
        env:
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import sys
          sys.path.insert(0, "packaging")
          from whisper_model_pack import load_manifest
          model_id = os.environ["MODEL_ID"]
          manifest, _ = load_manifest(model_id)
          print(f"model_id={model_id}")
          print(f"model_file={manifest['file']}")
          PY

      - name: Download and verify the pinned model and assemble pack
        env:
          MODEL_ID: ${{ steps.select.outputs.model_id }}
        run: python3 packaging/create_whisper_model_packs.py dist/asr-model-packs --model-id "$MODEL_ID"

      - name: Verify offline pack and installation tools
        run: python3 -m unittest discover -s packaging -p 'test_*.py'

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: speech-studio-pinned-asr-model
          path: dist/asr-model-packs/*.zip
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  portable-asr:
    name: ASR portable bundle (${{ matrix.target }})
    if: ${{ inputs.target_group == 'all' || (inputs.target_group == 'windows' && contains(matrix.target, 'windows-msvc')) }}
    needs: model-pack
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: X64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: ARM64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            arch: X64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: ARM64
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: ARM64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$RUNNER_ARCH" = "$EXPECTED_ARCH"

      - name: Install Linux GUI, audio, and ASR build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libasound2-dev cmake libclang-dev

      - name: Configure Clang toolset for Windows ARM64 Whisper
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -property installationPath
          if (-not $installation) { throw "Visual Studio installation was not found" }
          $clang = Join-Path $installation 'VC\Tools\Llvm\bin\clang-cl.exe'
          if (-not (Test-Path $clang)) { $clang = Join-Path $env:ProgramFiles 'LLVM\bin\clang-cl.exe' }
          if (-not (Test-Path $clang)) {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            & $installer modify --installPath $installation --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --quiet --wait --norestart
            if ($LASTEXITCODE -ne 0) { throw "Could not install the Visual Studio Clang toolset" }
          }
          if (-not (Test-Path $clang)) { throw "The Visual Studio clang-cl compiler was not installed" }
          @(
            'CMAKE_GENERATOR=Ninja'
            "CMAKE_TOOLCHAIN_FILE=$(Join-Path $env:GITHUB_WORKSPACE '.github\cmake\ggml-portable.cmake')"
            "CC_aarch64_pc_windows_msvc=$clang"
            "CXX_aarch64_pc_windows_msvc=$clang"
          ) | ForEach-Object { $_ >> $env:GITHUB_ENV }

      - name: Disable runner-specific Whisper CPU instructions on Apple Silicon
        if: matrix.target == 'aarch64-apple-darwin'
        run: echo "CMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/.github/cmake/ggml-portable.cmake" >> "$GITHUB_ENV"

      - name: Download verified model pack
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: speech-studio-pinned-asr-model
          path: dist/asr-model-packs

      - name: Extract and independently verify the selected model
        id: model
        env:
          MODEL_ID: ${{ needs.model-pack.outputs.model_id }}
          MODEL_FILE: ${{ needs.model-pack.outputs.model_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/speech-model"
          python_cmd=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_cmd=python; fi
          "$python_cmd" packaging/extract_whisper_model.py \
            "dist/asr-model-packs/$MODEL_ID.zip" \
            "$RUNNER_TEMP/speech-model/$MODEL_FILE" \
            --model-id "$MODEL_ID"
          echo "path=$RUNNER_TEMP/speech-model/$MODEL_FILE" >> "$GITHUB_OUTPUT"

      - name: Restore release ASR Cargo cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: speech-asr-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}-gui-audio-asr
          restore-keys: |
            speech-asr-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-

      - name: Build optimized ASR-enabled application
        env:
          BUILD_TARGET: ${{ matrix.target }}
          CARGO_BUILD_JOBS: 2
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: cargo build --locked --release --features asr --target "$BUILD_TARGET" -j 2

      - name: Assemble and smoke-test offline ASR portable bundle
        env:
          BUILD_TARGET: ${{ matrix.target }}
          MODEL_ID: ${{ needs.model-pack.outputs.model_id }}
          MODEL_FILE: ${{ needs.model-pack.outputs.model_file }}
          MODEL_PATH: ${{ steps.model.outputs.path }}
        run: |
          executable="${GITHUB_REPOSITORY##*/}"
          python_cmd=python3
          if [[ "$RUNNER_OS" == Windows ]]; then
            executable="$executable.exe"
            python_cmd=python
          fi
          "$python_cmd" packaging/portable.py \
            --target "$BUILD_TARGET" \
            --binary "target/$BUILD_TARGET/release/$executable" \
            --output dist/asr-preview \
            --whisper-model "$MODEL_PATH" \
            --whisper-model-id "$MODEL_ID"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: speech-studio-asr-preview-${{ matrix.target }}-${{ needs.model-pack.outputs.model_id }}
          path: dist/asr-preview/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
